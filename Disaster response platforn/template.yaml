AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  AI Disaster Response Platform — serverless backend for real-time incident
  reporting, AI-powered photo verification (Rekognition), and automated
  alerting (SNS) on top of DynamoDB Streams.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]


Globals:
  Function:
    Runtime: python3.12
    Timeout: 15
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref IncidentsTable
        # Built from the deterministic name (not !Ref PhotosBucket) — see note
        # on AnalyzeImageFunction's policy below for why.
        PHOTOS_BUCKET: !Sub 'disaster-response-photos-${Stage}-${AWS::AccountId}'
        ALERTS_TOPIC_ARN: !Ref AlertsTopic

Resources:

  # ────────────────────────────────
  # Data layer
  # ────────────────────────────────
  IncidentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub disaster-incidents-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: incidentId
          AttributeType: S
      KeySchema:
        - AttributeName: incidentId
          KeyType: HASH
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  PhotosBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub disaster-response-photos-${Stage}-${AWS::AccountId}
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT, GET, POST]
            AllowedOrigins: ['*']
            AllowedHeaders: ['*']
            MaxAge: 3000

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub disaster-response-frontend-${Stage}-${AWS::AccountId}
      WebsiteConfiguration:
        IndexDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'

  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub disaster-alerts-${Stage}
      DisplayName: Disaster Response Alerts

  # ────────────────────────────────
  # API layer
  # ────────────────────────────────
  DisasterApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Stage
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"

  CreateIncidentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/src/incidents/
      Handler: create.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IncidentsTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref DisasterApi
            Path: /incidents
            Method: POST

  ListIncidentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/src/incidents/
      Handler: list.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref IncidentsTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref DisasterApi
            Path: /incidents
            Method: GET

  GetIncidentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/src/incidents/
      Handler: get.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref IncidentsTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref DisasterApi
            Path: /incidents/{incidentId}
            Method: GET

  GetUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/src/incidents/
      Handler: upload_url.handler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref PhotosBucket
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref DisasterApi
            Path: /incidents/{incidentId}/upload-url
            Method: POST

  # ────────────────────────────────
  # Event-driven AI + alerting layer
  # ────────────────────────────────
  AnalyzeImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/src/image_analysis/
      Handler: analyze.handler
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IncidentsTable
        - RekognitionDetectOnlyPolicy: {}
        - Statement:
            - Sid: ReadUploadedPhotos
              Effect: Allow
              Action: s3:GetObject
              # Built from the bucket's deterministic name (not !Ref) on purpose —
              # !Ref/!GetAtt here would make this function's Role depend on PhotosBucket,
              # while PhotosBucket's S3 notification (below) depends on this function's
              # ARN, creating a circular dependency CloudFormation can't resolve.
              Resource: !Sub 'arn:aws:s3:::disaster-response-photos-${Stage}-${AWS::AccountId}/*'
      Events:
        PhotoUpload:
          Type: S3
          Properties:
            Bucket: !Ref PhotosBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/

  PublishAlertFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/src/alerts/
      Handler: publish.handler
      Policies:
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AlertsTopic.TopicName
        - DynamoDBStreamReadPolicy:
            TableName: !Ref IncidentsTable
            StreamName: !Select [3, !Split ['/', !GetAtt IncidentsTable.StreamArn]]
      Events:
        Stream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt IncidentsTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 1
            MaximumRetryAttempts: 2

Outputs:
  ApiUrl:
    Description: API Gateway base URL — set this as API_BASE_URL in frontend/index.html
    Value: !Sub https://${DisasterApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/
  FrontendUrl:
    Description: Public URL of the static frontend (after you sync frontend/ to FrontendBucket)
    Value: !GetAtt FrontendBucket.WebsiteURL
  FrontendBucketName:
    Value: !Ref FrontendBucket
  PhotosBucketName:
    Description: Upload incident photos here (via presigned URL) to trigger AI analysis
    Value: !Ref PhotosBucket
  AlertsTopicArn:
    Description: Subscribe your phone number or email to this topic for SMS/email alerts
    Value: !Ref AlertsTopic
  IncidentsTableName:
    Value: !Ref IncidentsTable
